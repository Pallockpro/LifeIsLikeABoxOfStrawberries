<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandboxels</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Loads the live game so updates to github.com/blackberryggames/sandboxels show up here automatically -->
<iframe src="https://blackberryggames.github.io/sandboxels/" title="Sandboxels"
  allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
<script>
  // Hand keyboard focus straight to the game
  document.querySelector('iframe').addEventListener('load', function () { this.focus(); });
</script>
</body>
</html>
