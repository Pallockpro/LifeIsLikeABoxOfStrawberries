<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Patch</title>
<style>html,body{margin:0;height:100%;background:#1c1b19;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}</style></head><body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');const W=800,H=500;
function fit(){const r=Math.min(innerWidth/W,innerHeight/H),d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;x.setTransform(r*d,0,0,r*d,(innerWidth-W*r)/2*d,(innerHeight-H*r)/2*d);scale=r}
let scale=1;addEventListener('resize',fit);fit();
const COLS=['#d23a4b','#e07a3f','#e6c055','#6aab79','#4f8fc0','#7a6cd6'];
let pad,ball,bricks,lives,score,level,state,keys={};
function build(){bricks=[];const rows=3+level,cols=10,bw=68,bh=20,ox=(W-cols*(bw+8)+8)/2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level>2&&(r+c)%5===0)continue;bricks.push({x:ox+c*(bw+8),y:60+r*(bh+8),w:bw,h:bh,col:COLS[r%COLS.length],hp:level>3&&r<2?2:1})}}
function serve(){ball={x:W/2,y:H-60,vx:0,vy:0,r:7};state='serve'}
function newGame(){pad={x:W/2-55,w:110,h:12,y:H-34};lives=3;score=0;level=1;build();serve()}
function launch(){if(state==='serve'){const s=5+level*.5;ball.vx=s*(Math.random()<.5?-.6:.6);ball.vy=-s;state='play'}else if(state==='over'||state==='won')newGame()}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();launch()}});addEventListener('keyup',e=>keys[e.key]=0);
function px(e){const r=cv.getBoundingClientRect();return((e.clientX-r.left)-(innerWidth-W*scale)/2)/scale}
addEventListener('pointermove',e=>{pad.x=Math.max(0,Math.min(W-pad.w,px(e)-pad.w/2))});addEventListener('pointerdown',e=>{pad.x=Math.max(0,Math.min(W-pad.w,px(e)-pad.w/2));launch()});
function update(){const sp=9;if(keys.ArrowLeft||keys.a)pad.x=Math.max(0,pad.x-sp);if(keys.ArrowRight||keys.d)pad.x=Math.min(W-pad.w,pad.x+sp);
 if(state==='serve'){ball.x=pad.x+pad.w/2;ball.y=pad.y-ball.r-1;return}if(state!=='play')return;
 for(let k=0;k<2;k++){ball.x+=ball.vx/2;ball.y+=ball.vy/2;
  if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x))}if(ball.y<ball.r){ball.vy*=-1;ball.y=ball.r}
  if(ball.vy>0&&ball.y+ball.r>=pad.y&&ball.y<pad.y+pad.h&&ball.x>pad.x-ball.r&&ball.x<pad.x+pad.w+ball.r){const h=(ball.x-(pad.x+pad.w/2))/(pad.w/2),s=Math.hypot(ball.vx,ball.vy)*1.01;const a=h*1.05;ball.vx=s*Math.sin(a);ball.vy=-Math.abs(s*Math.cos(a));ball.y=pad.y-ball.r}
  for(const b of bricks){if(b.hp<=0)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){const ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r)),oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));if(ox<oy)ball.vx*=-1;else ball.vy*=-1;b.hp--;score+=10;break}}}
 bricks=bricks.filter(b=>b.hp>0);if(!bricks.length){if(level>=5){state='won'}else{level++;build();serve()}}
 if(ball.y>H+20){lives--;lives>0?serve():state='over'}}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function draw(){x.fillStyle='#1c1b19';x.fillRect(-2000,-2000,5000,5000);x.fillStyle='#24221f';rr(0,0,W,H,10);
 bricks.forEach(b=>{x.fillStyle=b.col;x.globalAlpha=b.hp>1?1:.9;rr(b.x,b.y,b.w,b.h,4);if(b.hp>1){x.fillStyle='rgba(255,255,255,.25)';rr(b.x+4,b.y+4,b.w-8,4,2)}});x.globalAlpha=1;
 x.fillStyle='#f2eee8';rr(pad.x,pad.y,pad.w,pad.h,6);x.fillStyle='#d23a4b';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();
 x.fillStyle='#958d84';x.font='600 15px system-ui';x.textAlign='left';x.fillText('Score '+score,18,30);x.textAlign='center';x.fillText('Level '+level+' / 5',W/2,30);x.textAlign='right';x.fillText('Lives '+'●'.repeat(Math.max(0,lives)),W-18,30);
 const msg=state==='serve'?'Click, tap or press Space to launch':state==='over'?'Game over — click to play again':state==='won'?'You cleared every level! Click to play again':'';
 if(msg){x.fillStyle='#f2eee8';x.textAlign='center';x.font=(state==='serve'?'500 17px':'800 26px')+' system-ui';x.fillText(msg,W/2,H/2+60)}}
function loop(){update();draw();requestAnimationFrame(loop)}newGame();loop();
</script></body></html>
