<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandboxels</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #f2eee8;
    background:
      radial-gradient(circle at 20% 80%, rgba(230, 180, 80, 0.25), transparent 45%),
      radial-gradient(circle at 80% 20%, rgba(80, 160, 230, 0.22), transparent 45%),
      #141312;
  }
  .card { max-width: 440px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -0.5px; }
  .by { margin: 0 0 18px; color: #958d84; font-size: 14px; }
  p { margin: 0 0 22px; line-height: 1.55; color: #cfc8bf; }
  .play {
    display: inline-block; padding: 13px 26px; border-radius: 999px;
    background: #e0445a; color: #fff; font-weight: 700; font-size: 16px; text-decoration: none;
    box-shadow: 0 6px 24px rgba(224, 68, 90, 0.35); transition: transform 0.15s;
  }
  .play:hover { transform: translateY(-2px); }
  .alt { display: block; margin-top: 16px; font-size: 13px; color: #958d84; }
  .alt a { color: #e8c97a; }
</style>
</head>
<body>
  <!-- Sandboxels hides its canvas when embedded in another site, and its license
       forbids removing that, so it is opened in its own tab instead. -->
  <div class="card">
    <h1>Sandboxels</h1>
    <p class="by">by R74n</p>
    <p>Sandboxels only runs in its own tab, so it opens separately. Over 500 elements to mix, burn, freeze and blow up.</p>
    <a class="play" href="https://blackberryggames.github.io/sandboxels/" target="_blank" rel="noopener">Open Sandboxels</a>
    <span class="alt">or play on the <a href="https://sandboxels.r74n.com/" target="_blank" rel="noopener">official site</a></span>
  </div>
</body>
</html>
